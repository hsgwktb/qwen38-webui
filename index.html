<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen3.8-27B Uncensored · 对话</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#161b22; --bg3:#1f2630; --line:#2a3441;
    --fg:#e6edf3; --fg2:#9aa7b4; --fg3:#6b7683;
    --acc:#7c5cff; --acc2:#a78bfa; --ok:#3fb950; --warn:#d29922; --err:#f85149;
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--fg);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;height:100%;overflow:hidden}

  /* ---------- sidebar ---------- */
  aside{
    width:290px;flex:0 0 290px;background:var(--bg2);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow-y:auto;transition:margin-left .25s;
  }
  aside.hide{margin-left:-290px}
  .brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  .brand h1{margin:0;font-size:15px;letter-spacing:.2px}
  .brand p{margin:4px 0 0;color:var(--fg3);font-size:12px}
  .sec{padding:16px 18px;border-bottom:1px solid var(--line)}
  .sec h2{margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--fg3)}
  label{display:block;font-size:12px;color:var(--fg2);margin:10px 0 5px}
  input[type=text],input[type=password],input[type=number],select,textarea{
    width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--acc)}
  textarea{resize:vertical;min-height:64px;line-height:1.5}
  .row{display:flex;gap:8px}
  .row>*{flex:1;min-width:0}
  .range{display:flex;align-items:center;gap:10px}
  input[type=range]{flex:1;accent-color:var(--acc)}
  .val{font-size:12px;color:var(--acc2);min-width:38px;text-align:right;font-variant-numeric:tabular-nums}

  button{
    background:var(--bg3);border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;
    transition:.15s;
  }
  button:hover{border-color:var(--acc);background:#252d38}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  button.primary:hover{background:#6b4ae8}
  .full{width:100%}
  .btnrow{display:flex;gap:8px;margin-top:14px}
  .btnrow button{flex:1}

  .status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--fg2);margin-top:10px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--fg3);flex:0 0 8px}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.bad{background:var(--err)}
  .dot.wait{background:var(--warn);animation:pulse 1.1s infinite}
  @keyframes pulse{50%{opacity:.3}}

  /* API 接入面板 */
  .copyrow{display:flex;gap:6px;align-items:center}
  .copyrow input{flex:1;min-width:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
  .copyrow button{flex:0 0 auto;padding:8px 10px;font-size:12px;border-radius:8px}
  .copyrow button.done{border-color:var(--ok);color:var(--ok)}
  .apiNote{margin-top:11px;font-size:11px;color:var(--fg3);line-height:1.6}

  /* ---------- main ---------- */
  main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}

  /* appears when the user has scrolled up and new output is arriving below */
  #jump{position:absolute;right:24px;bottom:112px;z-index:6;display:none;
    align-items:center;gap:7px;padding:8px 14px;border-radius:20px;border:none;
    background:var(--acc);color:#fff;font:inherit;font-size:12.5px;cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.5)}
  #jump:hover{background:#6b4ae8}
  #jump.show{display:flex}
  header{
    display:flex;align-items:center;gap:12px;padding:12px 20px;
    border-bottom:1px solid var(--line);background:rgba(22,27,34,.85);
    backdrop-filter:blur(8px);
  }
  header .t{font-size:14px;font-weight:600}
  header .m{font-size:12px;color:var(--fg3);font-family:ui-monospace,Menlo,Consolas,monospace}
  header .sp{flex:1}
  .iconbtn{padding:7px 11px;font-size:13px}

  #scroll{flex:1;overflow-y:auto;padding:26px 20px 8px;scroll-behavior:smooth}
  .wrap{max-width:880px;margin:0 auto}

  .empty{text-align:center;color:var(--fg3);margin-top:14vh}
  .empty h2{color:var(--fg);font-size:22px;margin:0 0 8px;font-weight:600}
  .empty p{margin:0 0 22px;font-size:13.5px}
  .chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:620px;margin:0 auto}
  .chip{background:var(--bg2);border:1px solid var(--line);border-radius:20px;
    padding:8px 15px;font-size:13px;color:var(--fg2);cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--acc);color:var(--fg)}

  .msg{margin-bottom:24px;display:flex;gap:13px}
  .av{width:29px;height:29px;border-radius:8px;flex:0 0 29px;display:grid;place-items:center;
    font-size:12px;font-weight:700;margin-top:2px}
  .msg.user .av{background:#2b3a52;color:#9dc0ff}
  .msg.assistant .av{background:linear-gradient(135deg,var(--acc),#5b8cff);color:#fff}
  .body{flex:1;min-width:0}
  .who{font-size:12px;color:var(--fg3);margin-bottom:5px;display:flex;gap:9px;align-items:center}
  .content{word-wrap:break-word;overflow-wrap:anywhere}
  .content p{margin:0 0 11px}
  .content p:last-child{margin-bottom:0}
  .content h1,.content h2,.content h3{margin:16px 0 8px;line-height:1.3}
  .content h1{font-size:19px}.content h2{font-size:17px}.content h3{font-size:15px}
  .content ul,.content ol{margin:0 0 11px;padding-left:22px}
  .content li{margin:3px 0}
  .content code{background:#22272e;padding:2px 5px;border-radius:5px;
    font:13px ui-monospace,Menlo,Consolas,monospace;color:#ffa657}
  .content pre{background:#0b0f14;border:1px solid var(--line);border-radius:10px;
    padding:13px 15px;overflow-x:auto;margin:0 0 11px;position:relative}
  .content pre code{background:none;padding:0;color:#c9d1d9;font-size:12.5px;line-height:1.55}
  .content a{color:var(--acc2)}
  .content blockquote{border-left:3px solid var(--line);margin:0 0 11px;padding:2px 0 2px 13px;color:var(--fg2)}
  .content table{border-collapse:collapse;margin:0 0 11px;font-size:13px;display:block;overflow-x:auto}
  .content th,.content td{border:1px solid var(--line);padding:6px 10px;text-align:left}
  .content th{background:var(--bg2)}
  .cursor{display:inline-block;width:7px;height:15px;background:var(--acc);
    vertical-align:text-bottom;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .err{background:rgba(248,81,73,.09);border:1px solid rgba(248,81,73,.35);
    border-radius:9px;padding:11px 13px;color:#ffb3ae;font-size:13px}
  .meta{font-size:11px;color:var(--fg3);margin-top:7px;font-variant-numeric:tabular-nums}

  /* thinking (reasoning_content) block */
  .think{margin:0 0 10px;border:1px solid var(--line);border-radius:9px;
    background:#12161c;overflow:hidden}
  .think>summary{cursor:pointer;padding:7px 11px;font-size:12px;color:var(--fg3);
    user-select:none;list-style:none}
  .think>summary::-webkit-details-marker{display:none}
  .think>summary::before{content:"▸ ";color:var(--acc2)}
  .think[open]>summary::before{content:"▾ "}
  .think .tbody{padding:0 12px 11px;color:var(--fg3);font-size:12.5px;
    white-space:pre-wrap;max-height:320px;overflow-y:auto;line-height:1.6;
    border-top:1px solid var(--line);padding-top:9px;
    overscroll-behavior:contain;scrollbar-width:thin}

  /* ---------- composer ---------- */
  .composer{border-top:1px solid var(--line);padding:14px 20px 18px;background:var(--bg)}
  .cwrap{max-width:880px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);
    border-radius:14px;padding:11px 13px;display:flex;gap:11px;align-items:flex-end;transition:border-color .15s}
  .cwrap:focus-within{border-color:var(--acc)}
  #prompt{flex:1;background:none;border:none;outline:none;color:var(--fg);
    font:inherit;font-size:14.5px;resize:none;max-height:190px;min-height:24px;padding:3px 0;line-height:1.55}
  #send{background:var(--acc);border:none;color:#fff;border-radius:9px;width:37px;height:37px;
    display:grid;place-items:center;cursor:pointer;flex:0 0 37px;transition:.15s}
  #send:hover:not(:disabled){background:#6b4ae8}
  #send:disabled{opacity:.4;cursor:not-allowed}
  .hint{max-width:880px;margin:8px auto 0;font-size:11px;color:var(--fg3);text-align:center}

  @media(max-width:860px){
    aside{position:fixed;z-index:20;height:100%}
    aside.hide{margin-left:-290px}
    aside:not(.hide){box-shadow:0 0 40px rgba(0,0,0,.6)}
    .msg{gap:10px}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">
      <h1>Qwen3.8-27B · Uncensored</h1>
      <p>Colab GPU · llama.cpp · 本地直连</p>
    </div>

    <div class="sec">
      <h2>连接</h2>
      <label>API 地址（留空 = 同源）</label>
      <input id="baseUrl" type="text" placeholder="https://xxx.trycloudflare.com" spellcheck="false">
      <label>模型名</label>
      <input id="model" type="text" value="local" spellcheck="false">
      <label>API Key（可选）</label>
      <input id="apiKey" type="password" placeholder="sk-..." spellcheck="false">
      <div class="btnrow"><button id="test" class="full">测试连接</button></div>
      <div class="status"><span id="dot" class="dot"></span><span id="stat">未连接</span></div>
    </div>

    <div class="sec">
      <h2>API 接入（外部 Agent 用）</h2>
      <label>Base URL</label>
      <div class="copyrow">
        <input id="apiBase" type="text" readonly value="加载中…">
        <button data-copy="apiBase">复制</button>
      </div>
      <label>API Key</label>
      <div class="copyrow">
        <input id="apiKeyOut" type="text" readonly value="加载中…">
        <button data-copy="apiKeyOut">复制</button>
      </div>
      <label>模型名</label>
      <div class="copyrow">
        <input id="apiModel" type="text" readonly value="加载中…">
        <button data-copy="apiModel">复制</button>
      </div>
      <button id="copyEnv" class="full" style="margin-top:11px">复制全部（.env 格式）</button>
      <div class="apiNote">
        任何 OpenAI 兼容客户端都能直接用：<br>
        <code style="font-size:11px">base_url</code> + <code style="font-size:11px">api_key</code> + <code style="font-size:11px">model</code> 照上面填即可。<br>
        隧道是公开地址，密钥是唯一门禁，请勿外传。
      </div>
    </div>

    <div class="sec">
      <h2>生成参数</h2>
      <label>Temperature <span class="val" id="vTemp">0.70</span></label>
      <div class="range"><input id="temp" type="range" min="0" max="2" step="0.05" value="0.7"></div>
      <label>Top P <span class="val" id="vTopP">0.90</span></label>
      <div class="range"><input id="topP" type="range" min="0.05" max="1" step="0.05" value="0.9"></div>
      <label>最大输出 tokens</label>
      <input id="maxTok" type="number" min="16" max="32768" step="64" value="4096">
      <label>上下文长度（服务端启动时固定）</label>
      <input id="ctx" type="text" value="—" disabled>
    </div>

    <div class="sec">
      <h2>系统提示词</h2>
      <textarea id="sys" placeholder="留空则使用模型默认行为"></textarea>
    </div>

    <div class="sec">
      <h2>会话</h2>
      <div class="btnrow">
        <button id="clear">清空</button>
        <button id="export">导出</button>
      </div>
      <div class="status" style="margin-top:12px">
        <span id="usage" style="font-variant-numeric:tabular-nums">0 轮对话</span>
      </div>
    </div>
  </aside>

  <main>
    <header>
      <button id="toggle" class="iconbtn">☰</button>
      <div>
        <div class="t">对话</div>
        <div class="m" id="hModel">local</div>
      </div>
      <div class="sp"></div>
      <button id="stop" class="iconbtn" disabled>停止</button>
    </header>

    <div id="scroll"><div class="wrap" id="msgs"></div></div>
    <button id="jump">↓ 回到底部</button>

    <div class="composer">
      <div class="cwrap">
        <textarea id="prompt" rows="1" placeholder="发消息…  (Enter 发送，Shift+Enter 换行)"></textarea>
        <button id="send" title="发送">➤</button>
      </div>
      <div class="hint">模型输出不设内容限制，请自行判断用途。</div>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  const $ = id => document.getElementById(id);
  const LS = "qwen38ui.v1";

  const S = {
    baseUrl:"", model:"local", apiKey:"", temp:0.7, topP:0.9, maxTok:4096, sys:"",
    msgs:[], usage:0, busy:false, ac:null
  };

  /* ---------------- persistence ---------------- */
  function save(){
    try{
      localStorage.setItem(LS, JSON.stringify({
        baseUrl:S.baseUrl, model:S.model, apiKey:S.apiKey,
        temp:S.temp, topP:S.topP, maxTok:S.maxTok, sys:S.sys, msgs:S.msgs
      }));
    }catch(e){}
  }
  function load(){
    try{
      const d = JSON.parse(localStorage.getItem(LS)||"{}");
      Object.assign(S, {
        baseUrl:d.baseUrl??"", model:d.model||"local", apiKey:d.apiKey||"",
        temp:d.temp??0.7, topP:d.topP??0.9, maxTok:d.maxTok??4096,
        sys:d.sys||"", msgs:Array.isArray(d.msgs)?d.msgs:[]
      });
    }catch(e){}
  }

  const api = p => (S.baseUrl.trim().replace(/\/+$/,"") || "") + p;
  const headers = () => {
    const h = {"Content-Type":"application/json"};
    if(S.apiKey.trim()) h["Authorization"] = "Bearer " + S.apiKey.trim();
    return h;
  };

  /* ---------------- status ---------------- */
  function setStat(kind, text){
    $("dot").className = "dot " + kind;
    $("stat").textContent = text;
  }

  // 取出服务端 JSON 里的错误说明，别只给用户一句 "HTTP 500"
  async function errText(r){
    try{
      const j = await r.json();
      const m = (j && j.error && (j.error.message || j.error)) || (j && j.message) || "";
      return typeof m === "string" ? m : JSON.stringify(m);
    }catch(e){ return ""; }
  }

  async function testConn(silent){
    if(!silent) setStat("wait","连接中…");
    try{
      const r = await fetch(api("/v1/models"), {headers:headers(), signal:AbortSignal.timeout(12000)});
      if(!r.ok){
        const t = await errText(r);
        throw new Error("HTTP " + r.status + (t ? " · " + t : ""));
      }
      const d = await r.json();
      const ids = (d.data||[]).map(x=>x.id);
      if(!ids.includes(S.model) && ids.length) {
        S.model = ids[0]; $("model").value = S.model;
      }
      setStat("ok","已连接 · " + (ids[0]||S.model));
      $("hModel").textContent = S.model;
      return true;
    }catch(e){
      const msg = (e.name==="TimeoutError") ? "超时（12s 内无响应）" : e.message;
      // 状态栏放不下长文，截断显示，完整内容进控制台
      setStat("bad","连接失败：" + (msg.length>150 ? msg.slice(0,150)+"…" : msg));
      if(msg.length>150) console.warn("完整错误：", msg);
      return false;
    }
  }

  /* ---------------- markdown (compact, offline) ---------------- */
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  function md(src){
    const blocks = [];
    // fenced code first (protect from other rules)
    let t = src.replace(/```([\w+-]*)\n?([\s\S]*?)```/g, (m,lang,code) => {
      const i = blocks.push('<pre><code>'+esc(code.replace(/\n$/,""))+'</code></pre>') - 1;
      return "\u0000B"+i+"\u0000";
    });

    t = esc(t);

    // tables
    t = t.replace(/^\|(.+)\|\r?\n\|[\s:|-]+\|\r?\n((?:\|.*\|\r?\n?)*)/gm, (m,head,rows)=>{
      const th = head.split("|").map(s=>s.trim()).filter(s=>s!=="");
      const body = rows.trim().split(/\r?\n/).map(r=>r.split("|").map(s=>s.trim()).filter((s,i,a)=>!(i===0&&s==="")&&!(i===a.length-1&&s==="")));
      let h = "<table><thead><tr>"+th.map(c=>"<th>"+c+"</th>").join("")+"</tr></thead><tbody>";
      body.forEach(r=>{ if(r.length) h += "<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>"; });
      return h + "</tbody></table>\n";
    });

    // headings
    t = t.replace(/^###### (.+)$/gm,"<h3>$1</h3>")
         .replace(/^##### (.+)$/gm,"<h3>$1</h3>")
         .replace(/^#### (.+)$/gm,"<h3>$1</h3>")
         .replace(/^### (.+)$/gm,"<h3>$1</h3>")
         .replace(/^## (.+)$/gm,"<h2>$1</h2>")
         .replace(/^# (.+)$/gm,"<h1>$1</h1>");

    // blockquote
    t = t.replace(/^&gt; (.+)$/gm,"<blockquote>$1</blockquote>");

    // lists
    t = t.replace(/^(?:[-*+] .+\r?\n?)+/gm, m => "<ul>"+m.replace(/^[-*+] (.+)$/gm,"<li>$1</li>").replace(/\r?\n/g,"")+"</ul>");
    t = t.replace(/^(?:\d+\. .+\r?\n?)+/gm, m => "<ol>"+m.replace(/^\d+\. (.+)$/gm,"<li>$1</li>").replace(/\r?\n/g,"")+"</ol>");

    // inline
    t = t.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>")
         .replace(/(^|[^*\w])\*([^*\n]+)\*/g,"$1<em>$2</em>")
         .replace(/`([^`\n]+)`/g,"<code>$1</code>")
         .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');

    // paragraphs / line breaks
    t = t.split(/\n{2,}/).map(p=>{
      p = p.trim();
      if(!p) return "";
      if(/^<(h[123]|ul|ol|pre|table|blockquote)/.test(p)) return p;
      return "<p>"+p.replace(/\n/g,"<br>")+"</p>";
    }).join("");

    return t.replace(/\u0000B(\d+)\u0000/g, (m,i)=>blocks[+i]);
  }

  /* ---------------- render ---------------- */
  // Only auto-scroll when the reader is already at the bottom. While text streams
  // in, scrolling up must win — otherwise every chunk yanks the page back down.
  const NEAR = 64;                                   // px tolerance
  const nearBottom = el => el.scrollHeight - el.scrollTop - el.clientHeight <= NEAR;

  let stickPage = true;
  const scroller = $("scroll");

  function updateJump(){
    $("jump").classList.toggle("show", !stickPage && S.busy);
  }
  scroller.addEventListener("scroll", ()=>{
    stickPage = nearBottom(scroller);
    updateJump();
  }, {passive:true});

  function toBottom(force){
    if(force) stickPage = true;
    if(stickPage) scroller.scrollTop = scroller.scrollHeight;
    updateJump();
  }

  function countUsage(){ $("usage").textContent = S.msgs.filter(m=>m.role==="user").length + " 轮对话"; }

  /* reasoning_content is what a thinking model streams before the answer; without
     showing it the UI looks frozen for many seconds. */
  function thinkHtml(reasoning){
    if(!reasoning || !reasoning.trim()) return "";
    return '<details class="think">'+
           '<summary>思考过程 ('+reasoning.length+' 字)</summary>'+
           '<div class="tbody">'+esc(reasoning)+'</div></details>';
  }

  function bubble(role, text, meta, reasoning){
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.innerHTML =
      '<div class="av">'+(role==="user"?"你":"AI")+'</div>'+
      '<div class="body"><div class="who">'+(role==="user"?"你":"助手")+
      (meta?'<span>'+meta+'</span>':'')+'</div><div class="content"></div></div>';
    const c = el.querySelector(".content");
    if(role==="user") c.textContent = text;
    else c.innerHTML = thinkHtml(reasoning) + md(text);
    $("msgs").appendChild(el);
    return c;
  }

  // Streaming needs a *persistent* DOM tree: rebuilding innerHTML per chunk would
  // recreate .tbody each time and reset its scroll position back to the top.
  function streamBubble(){
    const c = bubble("assistant", "");
    const think = document.createElement("details");
    think.className = "think";
    think.style.display = "none";
    const summary = document.createElement("summary");
    const tbody = document.createElement("div");
    tbody.className = "tbody";
    think.append(summary, tbody);

    const answer = document.createElement("div");
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    c.append(think, answer, cursor);

    return {content:c, think, summary, tbody, answer, cursor};
  }

  function renderAll(){
    $("msgs").innerHTML = "";
    if(!S.msgs.length){ showEmpty(); return; }
    S.msgs.forEach(m=> bubble(m.role, m.content, m.meta, m.reasoning));
    toBottom(true);
  }

  function showEmpty(){
    $("msgs").innerHTML =
      '<div class="empty"><h2>Qwen3.8-27B Uncensored</h2>'+
      '<p>已连接到 Colab GPU 上的推理服务，直接开始对话。</p>'+
      '<div class="chips">'+
      ['用一句话介绍你自己','写一个 Python 快速排序并解释','比较 TCP 和 UDP 的区别','给我讲个短故事'].map(s=>
        '<div class="chip">'+s+'</div>').join("")+
      '</div></div>';
    $("msgs").querySelectorAll(".chip").forEach(ch=>{
      ch.onclick = ()=>{ $("prompt").value = ch.textContent; autoGrow(); $("prompt").focus(); };
    });
  }

  function setBusy(b){
    S.busy = b;
    $("send").disabled = b;
    $("stop").disabled = !b;
    updateJump();
  }

  /* ---------------- chat ---------------- */
  async function send(){
    const box = $("prompt");
    const text = box.value.trim();
    if(!text || S.busy) return;

    const empty = $("msgs").querySelector(".empty");
    if(empty) empty.remove();

    S.msgs.push({role:"user", content:text});
    bubble("user", text);
    box.value = ""; autoGrow(); countUsage(); save(); toBottom(true);

    const payload = {
      model: S.model,
      messages: [
        ...(S.sys.trim() ? [{role:"system", content:S.sys.trim()}] : []),
        ...S.msgs.map(m=>({role:m.role, content:m.content}))
      ],
      temperature: S.temp,
      top_p: S.topP,
      max_tokens: S.maxTok,
      stream: true
    };

    setBusy(true);
    const B = streamBubble();
    let acc = "", reasoning = "", ttft = 0, t0 = performance.now(), outTok = 0;
    S.ac = new AbortController();

    try{
      const r = await fetch(api("/v1/chat/completions"), {
        method:"POST", headers:headers(), body:JSON.stringify(payload), signal:S.ac.signal
      });
      if(!r.ok){
        const body = await r.text();
        throw new Error("HTTP " + r.status + " — " + body.slice(0,300));
      }

      const rd = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "";

      while(true){
        const {done, value} = await rd.read();
        if(done) break;
        buf += dec.decode(value, {stream:true});
        const lines = buf.split("\n");
        buf = lines.pop();

        for(const raw of lines){
          const line = raw.trim();
          if(!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if(data === "[DONE]") continue;
          let j;
          try{ j = JSON.parse(data); }catch(e){ continue; }
          const d = (j.choices||[])[0]||{};
          const rc = (d.delta && d.delta.reasoning_content) || "";
          const piece = (d.delta && d.delta.content) || "";

          if(rc){
            if(!ttft) ttft = performance.now() - t0;
            reasoning += rc;
            if(B.think.style.display === "none"){
              B.think.style.display = "";
              B.think.open = true;                    // follow the thinking live
            }
            // append-only: never rebuild .tbody, so its scroll position survives
            B.tbody.appendChild(document.createTextNode(rc));
            B.summary.textContent = "思考过程 (" + reasoning.length + " 字)";
            toBottom();
          }
          if(piece){
            if(!ttft) ttft = performance.now() - t0;
            acc += piece; outTok++;
            B.answer.innerHTML = md(acc);
            toBottom();
          }
          if(j.usage) outTok = j.usage.completion_tokens || outTok;
        }
      }

      if(!acc.trim()) acc = reasoning.trim() ? "（仅返回了思考内容）" : "（模型没有返回内容）";
      const dt = (performance.now() - t0)/1000;
      const meta = outTok + " tok · " + (ttft?("首字 "+(ttft/1000).toFixed(2)+"s · "):"") +
                   (outTok/Math.max(dt,.001)).toFixed(1) + " tok/s";
      B.cursor.remove();
      B.answer.innerHTML = md(acc);
      if(!reasoning.trim()) B.think.remove();
      else { B.summary.textContent = "思考过程 (" + reasoning.length + " 字)"; B.think.open = false; }

      S.msgs.push({role:"assistant", content:acc, reasoning:reasoning, meta});
      const who = B.content.closest(".body").querySelector(".who");
      who.insertAdjacentHTML("beforeend","<span>"+meta+"</span>");
      save();

    }catch(e){
      const cur = B.content.querySelector(".cursor");
      if(cur) cur.remove();
      if(e.name === "AbortError"){
        B.answer.innerHTML = md(acc || "（已停止）");
        if(!reasoning.trim()) B.think.remove();
        else B.think.open = false;
        if(acc || reasoning) S.msgs.push({role:"assistant", content:acc||"（已停止）",
                                          reasoning:reasoning, meta:"已手动停止"});
      }else{
        B.content.innerHTML = '<div class="err">请求失败：'+esc(e.message)+
          '<br><br>请检查侧栏 API 地址是否正确、Colab 会话是否仍在运行、隧道是否过期。</div>';
      }
      save();
    }finally{
      setBusy(false); S.ac = null; toBottom();
    }
  }

  /* ---------------- API 接入信息 ---------------- */
  // Values come from the server so the UI never has to hard-code the tunnel host.
  function loadApiInfo(){
    fetch("/__api_info", {signal: AbortSignal.timeout(8000)})
      .then(r=>r.ok ? r.json() : Promise.reject(new Error("HTTP "+r.status)))
      .then(d=>{
        $("apiBase").value  = d.base_url || "(未获取到)";
        $("apiKeyOut").value = d.api_key || "";
        $("apiModel").value  = d.model || "local";
        // keep the generator in sync so the bundled chat uses the same alias
        if(d.model){ S.model = d.model; $("model").value = d.model; $("hModel").textContent = d.model; }
        // 上游没跑就直接说清楚，不用等用户点“测试连接”才看到红点
        if(d.upstream_ok === false)
          setStat("bad","上游 llama-server 未运行（" + (d.upstream||"127.0.0.1:8081") + "）—— 请重跑第 5 格");
      })
      .catch(e=>{
        $("apiBase").value = "(获取失败: "+e.message+")";
        $("apiKeyOut").value = "(获取失败)";
        $("apiModel").value = "(获取失败)";
      });
  }

  function flash(btn){
    const old = btn.textContent;
    btn.textContent = "已复制"; btn.classList.add("done");
    setTimeout(()=>{ btn.textContent = old; btn.classList.remove("done"); }, 1200);
  }

  async function copyText(text, btn){
    try{
      await navigator.clipboard.writeText(text);
    }catch(e){
      // clipboard API needs a secure context; fall back to selection
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); }catch(_){}
      ta.remove();
    }
    if(btn) flash(btn);
  }

  /* ---------------- input ---------------- */
  function autoGrow(){
    const t = $("prompt");
    t.style.height = "auto";
    t.style.height = Math.min(t.scrollHeight, 190) + "px";
  }

  /* ---------------- wire ---------------- */
  load();
  $("baseUrl").value = S.baseUrl; $("model").value = S.model; $("apiKey").value = S.apiKey;
  $("temp").value = S.temp; $("topP").value = S.topP; $("maxTok").value = S.maxTok;
  $("sys").value = S.sys;
  $("vTemp").textContent = (+S.temp).toFixed(2);
  $("vTopP").textContent = (+S.topP).toFixed(2);
  $("hModel").textContent = S.model;
  renderAll(); countUsage();
  loadApiInfo();

  document.querySelectorAll("[data-copy]").forEach(btn=>{
    btn.onclick = ()=> copyText(($(btn.dataset.copy).value || "").trim(), btn);
  });
  $("copyEnv").onclick = ()=>{
    const env =
      "OPENAI_BASE_URL=" + $("apiBase").value.trim() + "\n" +
      "OPENAI_API_KEY="  + $("apiKeyOut").value.trim() + "\n" +
      "OPENAI_MODEL="    + $("apiModel").value.trim() + "\n";
    copyText(env, $("copyEnv"));
  };

  // same-origin deployments know the context size
  fetch(api("/health"), {signal:AbortSignal.timeout(6000)}).then(r=>r.json())
    .then(d=>{ if(d && d.default_generation_settings && d.default_generation_settings.n_ctx)
      $("ctx").value = d.default_generation_settings.n_ctx + " tokens"; })
    .catch(()=>{});

  testConn(true);

  $("toggle").onclick = ()=> $("side").classList.toggle("hide");
  $("send").onclick = send;
  $("stop").onclick = ()=>{ if(S.ac) S.ac.abort(); };
  $("test").onclick = ()=> testConn(false);
  $("jump").onclick = ()=>{ toBottom(true); };

  $("prompt").addEventListener("input", autoGrow);
  $("prompt").addEventListener("keydown", e=>{
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }
  });

  $("baseUrl").oninput = e=>{ S.baseUrl = e.target.value; save(); };
  $("model").oninput   = e=>{ S.model = e.target.value; $("hModel").textContent = S.model; save(); };
  $("apiKey").oninput  = e=>{ S.apiKey = e.target.value; save(); };
  $("sys").oninput     = e=>{ S.sys = e.target.value; save(); };
  $("maxTok").oninput  = e=>{ S.maxTok = +e.target.value || 4096; save(); };
  $("temp").oninput    = e=>{ S.temp = +e.target.value; $("vTemp").textContent = S.temp.toFixed(2); save(); };
  $("topP").oninput    = e=>{ S.topP = +e.target.value; $("vTopP").textContent = S.topP.toFixed(2); save(); };

  $("clear").onclick = ()=>{
    if(S.msgs.length && !confirm("清空当前对话？")) return;
    S.msgs = []; renderAll(); countUsage(); save();
  };
  $("export").onclick = ()=>{
    const blob = new Blob([JSON.stringify(S.msgs,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "qwen38-chat.json"; a.click(); URL.revokeObjectURL(a.href);
  };
})();
</script>
</body>
